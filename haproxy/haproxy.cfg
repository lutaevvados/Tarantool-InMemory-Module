global
    maxconn 4096
    log stdout local0


defaults
    log global
    mode tcp
    option tcplog

    timeout connect 5000
    timeout client 50000
    timeout server 50000


listen stats
    mode http
    bind *:8404

    stats enable
    stats uri /stats
    stats refresh 10s



listen pg_master

    bind *:5000
    mode tcp

    option httpchk GET /leader
    http-check expect status 200
    option tcpka

    server patroni_node_1 patroni_node_1:5432 check port 8008
    server patroni_node_2 patroni_node_2:5432 check port 8008
    server patroni_node_3 patroni_node_3:5432 check port 8008



listen pg_replicas

    bind *:5001
    mode tcp

    option httpchk GET /replica
    http-check expect status 200

    option tcpka

    server patroni_node_1 patroni_node_1:5432 check port 8008
    server patroni_node_2 patroni_node_2:5432 check port 8008
    server patroni_node_3 patroni_node_3:5432 check port 8008
